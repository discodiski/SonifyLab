name: Pylint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint PyQt5
    
    - name: Run Pylint on SonifyLab.py
      run: |
        pylint SonifyLab.py --exit-zero --disable=C0114,C0115,C0116,R0902,R0903,R0914,R0915,W0612,W0613 --max-line-length=120
